    <path d="M252 170c-4-20-2-38 6-52" stroke="#d8ecf8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <g transform="translate(262 96)">
      <rect x="-30" y="-52" width="50" height="62" rx="6" fill="#e9e2d2" transform="rotate(-26)"/>
      <rect x="-12" y="-66" width="50" height="62" rx="6" fill="#f4efe4" transform="rotate(22)"/>
      <rect x="-25" y="-64" width="50" height="62" rx="6" fill="#fffaf0"/>
      <path d="M-15 -50h30M-15 -38h30M-15 -26h20" stroke="#9fb3c8" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- body = cabinet with three drawers -->
    <use href="#bodyp" fill="url(#hide)"/>
    <g clip-path="url(#body)">
      <rect x="60" y="334" width="400" height="90" fill="#a8bccf"/>
      <path d="M60 252H440M60 334H440" stroke="#162a3d" stroke-width="7"/>
      <g fill="#f4efe4"><rect x="252" y="196" width="88" height="26" rx="5"/><rect x="252" y="270" width="88" height="26" rx="5"/><rect x="252" y="350" width="88" height="26" rx="5"/></g>
      <g fill="#162a3d" opacity=".75"><rect x="276" y="230" width="40" height="10" rx="5"/><rect x="276" y="306" width="40" height="10" rx="5"/><rect x="276" y="386" width="40" height="10" rx="5"/></g>
      <g fill="#9fb3c8"><rect x="266" y="205" width="60" height="6" rx="3"/><rect x="266" y="279" width="60" height="6" rx="3"/><rect x="266" y="359" width="60" height="6" rx="3"/></g>
    </g>
    <!-- face -->
    <circle cx="146" cy="226" r="18" fill="#fffaf0"/>
    <circle cx="150" cy="229" r="10" fill="#0c1b2a"/>
    <circle cx="154" cy="224" r="3.5" fill="#fff"/>
    <path d="M100 286c20 16 50 20 76 8" stroke="#162a3d" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- sea in front -->
    <path d="M0 438C64 414 118 458 184 436S300 412 364 436S466 458 512 432V512H0Z" fill="#0a2c4a"/>
    <path d="M0 438C64 414 118 458 184 436S300 412 364 436S466 458 512 432" stroke="#5fb3e0" stroke-width="5" fill="none" opacity=".5"/>
