<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fc8"/><stop offset="1" stop-color="#0d3a5f"/>
    </linearGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#40627f"/><stop offset="1" stop-color="#27405a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="body"><path id="bodyp" d="M78 306C78 220 160 170 258 170C352 170 410 222 420 286C426 326 406 362 368 382C328 402 286 410 236 410C140 410 78 372 78 306Z"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sea)"/>
    <circle cx="96" cy="120" r="7" fill="#cfe6f5" opacity=".35"/><circle cx="130" cy="84" r="4" fill="#cfe6f5" opacity=".35"/><circle cx="420" cy="96" r="5" fill="#cfe6f5" opacity=".3"/>
    <!-- tail -->
    <path d="M384 318C420 300 440 262 444 214C426 196 410 176 408 146C432 156 452 172 462 190C476 172 496 164 512 166C502 186 486 204 468 216C466 272 440 320 400 348Z" fill="#2f4b67"/>
