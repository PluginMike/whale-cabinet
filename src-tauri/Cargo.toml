[package]
name = "whale-cabinet"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
libc = "0.2"
gtk = "0.18"
trash = "5"
xattr = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
png = "0.18"
infer = "0.22"
md-5 = "0.11"
sha2 = "0.11"
crc32fast = "1"
kamadak-exif = "0.6"
portable-pty = "0.9"
tauri-plugin-single-instance = "2"
tauri-plugin-drag = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
