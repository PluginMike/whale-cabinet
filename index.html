<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Whale Cabinet</title>
  <link rel="stylesheet" href="/src/style.css" />
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <div id="app" hidden>
    <div id="titlebar" data-tauri-drag-region hidden>
      <span data-tauri-drag-region>Whale Cabinet</span>
      <button id="tb-min" title="Minimize">–</button><button id="tb-max" title="Maximize">□</button><button id="tb-close" title="Close">✕</button>
    </div>
    <header id="topbar">
      <button id="back" title="Back (Alt+Left)">‹</button>
      <button id="fwd" title="Forward (Alt+Right)">›</button>
      <button id="up" title="Up (Alt+Up)">↑</button>
      <button id="home" title="Home (Alt+Home)">⌂</button>
      <nav id="crumbs" title="Click empty space or Ctrl+L to edit"></nav>
      <input id="pathedit" spellcheck="false" hidden />
      <span id="gitchip" hidden></span>
      <input id="filter" placeholder="Filter…" spellcheck="false" />
      <select id="viewmode" title="View mode (Ctrl+1/2/3)">
        <option value="cabinet">Cabinet</option><option value="compact">Compact</option><option value="grid">Icons</option>
      </select>
      <select id="sort" title="Sort">
        <option value="name">Name</option><option value="size">Size</option><option value="mtime">Date</option><option value="type">Type</option><option value="rank">Relevance</option>
      </select>
      <button id="sortdir" title="Reverse sort">↓</button>
      <button id="hidden" title="Show hidden (Ctrl+H)">.*</button>
      <button id="splitbtn" title="Split view (F3)">◫</button>
      <button id="menubtn" title="Settings">☰</button>
    </header>
    <aside id="sidebar">
      <section class="sec" id="sec-places" data-sec="places"><h3 class="section">Places</h3><div class="sec-body"><div id="places"></div></div></section>
      <section class="sec" id="sec-recent" data-sec="recent"><h3 class="section">Recent</h3><div class="sec-body"><div id="recent"></div></div></section>
      <section class="sec" id="freq-head" data-sec="frequent" hidden><h3 class="section">Frequent</h3><div class="sec-body"><div id="frequent"></div></div></section>
      <section class="sec" id="dev-head" data-sec="devices" hidden><h3 class="section">Devices</h3><div class="sec-body"><div id="devices"></div></div></section>
      <section class="sec" id="net-head" data-sec="network"><h3 class="section">Network</h3><div class="sec-body"><div id="network"></div></div></section>
      <section class="sec" id="tag-head" data-sec="tags" hidden><h3 class="section">Tags</h3><div class="sec-body"><div id="tags"></div></div></section>
      <section class="sec" id="tools-head" data-sec="tools"><h3 class="section">Tools</h3><div class="sec-body"><div id="tools"></div></div></section>
    </aside>
    <div id="center">
      <div id="tabbar" hidden></div>
      <div id="views"></div>
      <div id="termpanel" hidden></div>
    </div>
    <aside id="info"><div id="info-grip" title="Drag to resize"></div><div id="info-body"></div></aside>
    <footer id="status"><span id="st-count"></span><span id="st-sel"></span><span id="st-zoom"></span><span id="st-free"></span></footer>
  </div>
  <div id="menu" hidden></div>
  <div id="progress" hidden></div>
  <div id="quicklook" hidden></div>
  <div id="dialog" hidden></div>
</body>
</html>
