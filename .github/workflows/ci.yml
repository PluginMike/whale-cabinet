name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev poppler-utils
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Plugin tests
        run: |
          python3 plugins/nextcloud/test_nextcloud.py
          python3 plugins/bitwarden/test_bitwarden.py
